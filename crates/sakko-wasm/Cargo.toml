[package]
name = "sakko-wasm"
description = "WASM bindings for the Sakko compiler: tokenize / parse / check / version over a typed JSON DTO layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sakko = { path = "../sakko", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"

[[test]]
name = "api"
path = "../../Tests/sakko-wasm/api.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"