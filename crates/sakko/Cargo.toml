[package]
name = "sakko"
description = "Sakko programming language: lexer, parser, and AST"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
chumsky = { version = "1.0.0-alpha.8", features = ["pratt"] }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "atcode_parser"
path = "../../Tests/sakko/atcode_parser.rs"

[[test]]
name = "atcode_tokenizer"
path = "../../Tests/sakko/atcode_tokenizer.rs"

[[test]]
name = "errors"
path = "../../Tests/sakko/errors.rs"

[[test]]
name = "examples"
path = "../../Tests/sakko/examples.rs"

[[test]]
name = "parser"
path = "../../Tests/sakko/parser.rs"

[[test]]
name = "saho"
path = "../../Tests/sakko/saho.rs"

[[test]]
name = "tokenizer"
path = "../../Tests/sakko/tokenizer.rs"

[[test]]
name = "typecheck"
path = "../../Tests/sakko/typecheck.rs"

[[test]]
name = "types"
path = "../../Tests/sakko/types.rs"
